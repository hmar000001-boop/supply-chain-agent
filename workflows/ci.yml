name: Java CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java 21 / Maven / LangGraph4j + LangChain4j
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: supply_chain_agent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d supply_chain_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: supply_chain_agent
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify M8 architecture and direct framework dependencies
        run: python3 scripts/verify-m8-b5-architecture.py

      - name: Verify M8-R2 outcome-feedback and evidence guardrails
        run: python3 scripts/verify-m8-r2-evidence.py

      - name: Prepare security evidence directory
        run: mkdir -p target/security

      - name: Initialize CodeQL (Java/Kotlin, source analysis)
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache pinned Apache Maven distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper/dists/apache-maven-3.9.16
          key: maven-dist-${{ runner.os }}-3.9.16-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Build and run all tests, including PostgreSQL checkpoint recovery
        id: build
        run: ./mvnw -B -ntp -Dphase0.postgres=true clean install

      - name: Analyze CodeQL results without requiring GitHub Security Events upload
        if: success()
        uses: github/codeql-action/analyze@v4
        with:
          output: ${{ github.workspace }}/target/security/codeql-results
          upload: never

      - name: Run Trivy filesystem SCA, secret and misconfiguration scan
        if: success()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          format: sarif
          output: target/security/trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Record security tool versions
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'codeql_action=github/codeql-action@v4\n'
            printf 'trivy_action=aquasecurity/trivy-action@v0.36.0\n'
            trivy --version
          } > target/security/TOOL-VERSIONS.txt
          test -s target/security/trivy-fs.sarif

      - name: Generate M8-B2 matched comparison and determinism artifacts
        if: success()
        run: >-
          ./mvnw -B -ntp -pl supply-chain-agent-evaluation
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=dev.supplychain.agent.evaluation.app.M8ComparisonCli
          -Dexec.classpathScope=runtime
          -Dexec.args="--output-dir $GITHUB_WORKSPACE/target/m8-b2-results"

      - name: Record M8-B2 artifact provenance and checksums
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$GITHUB_WORKSPACE/target/m8-b2-results"
          test -s "$ARTIFACT_DIR/m8-b2-raw-runs.jsonl"
          test -s "$ARTIFACT_DIR/m8-b2-comparison-report.jsonl"
          test -s "$ARTIFACT_DIR/m8-b2-determinism-check.jsonl"
          (
            cd "$ARTIFACT_DIR"
            sha256sum \
              m8-b2-raw-runs.jsonl \
              m8-b2-comparison-report.jsonl \
              m8-b2-determinism-check.jsonl > SHA256SUMS.txt
          )
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'source_revision=%s\n' "$GITHUB_SHA"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
            printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'workflow_run_url=https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'created_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'm8_b2_corpus_version=M8-B1-v1\n'
            printf 'm8_b5_baseline_archive_sha256=8632ae0c2008b23253bb6582f2a55a33a6ed38c6f4445245ec4c42710418d4b9\n'
            printf 'accepted_b4d_correction_zip_sha256=e2a20540b21cc584919fc87e1540dab4dece53edcba8977dab24e82602f46a32\n'
          } > "$ARTIFACT_DIR/RUN-PROVENANCE.txt"


      - name: Generate reproducible M8-B3 mechanism ablation artifacts
        if: success()
        run: >-
          ./mvnw -B -ntp -pl supply-chain-agent-evaluation
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=dev.supplychain.agent.evaluation.app.M8AblationCli
          -Dexec.classpathScope=runtime
          -Dexec.args="--output-dir $GITHUB_WORKSPACE/target/m8-b3-results"

      - name: Record M8-B3 ablation provenance and checksums
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$GITHUB_WORKSPACE/target/m8-b3-results"
          test -s "$ARTIFACT_DIR/m8-b3-raw-ablations.jsonl"
          test -s "$ARTIFACT_DIR/m8-b3-paired-analysis.jsonl"
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'source_revision=%s\n' "$GITHUB_SHA"
            printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_run_url=https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'ablation_protocol=M8-B3-registered-mechanism-ablation-v1\n'
            printf 'R2_feedback_overlay=protocol-tested-in-mechanism-unit-tests\n'
            printf 'verified_outcome_corpus=absent; no empirical feedback effect inferred\n'
          } > "$ARTIFACT_DIR/RUN-PROVENANCE.txt"
          (
            cd "$ARTIFACT_DIR"
            sha256sum m8-b3-raw-ablations.jsonl m8-b3-paired-analysis.jsonl RUN-PROVENANCE.txt > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Generate M8-R2 outcome-feedback and final evidence artifact
        if: success()
        run: >-
          ./mvnw -B -ntp -pl supply-chain-agent-evaluation
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=dev.supplychain.agent.evaluation.app.M8R2OutcomeFeedbackEvidenceCli
          -Dexec.classpathScope=runtime
          -Dexec.args="--output-dir $GITHUB_WORKSPACE/target/m8-r2-results"

      - name: Record M8-R2 evidence provenance and checksums
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$GITHUB_WORKSPACE/target/m8-r2-results"
          test -s "$ARTIFACT_DIR/m8-r2-outcome-feedback-evidence.json"
          test -s "$ARTIFACT_DIR/M8-R2-EVIDENCE-CONCLUSION.txt"
          test -s "$ARTIFACT_DIR/SHA256SUMS.txt"
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'source_revision=%s\n' "$GITHUB_SHA"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
            printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'workflow_run_url=https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'created_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'baseline_policy_version=b1-topk-v1+b3-required-aware-v1\n'
            printf 'verified_outcome_corpus=absent\n'
            printf 'holdout_dataset=absent\n'
            printf 'adaptive_policy_activation=disabled\n'
            printf 'interpretation=protocol-validity-only; no empirical advantage claimed\n'
          } > "$ARTIFACT_DIR/RUN-PROVENANCE.txt"
          (
            cd "$ARTIFACT_DIR"
            sha256sum m8-r2-outcome-feedback-evidence.json M8-R2-EVIDENCE-CONCLUSION.txt RUN-PROVENANCE.txt > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Verify PostgreSQL backup and isolated restore
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pg_dump >/dev/null || ! command -v pg_restore >/dev/null || ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client-16
          fi
          BACKUP_PATH="$RUNNER_TEMP/supply-chain-agent-m7-backup.dump"
          RESTORE_DATABASE="sca_m7_restore_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          bash ./scripts/postgres/backup.sh "$BACKUP_PATH"
          createdb --maintenance-db=postgres "$RESTORE_DATABASE"
          cleanup() {
            dropdb --if-exists --maintenance-db=postgres "$RESTORE_DATABASE" || true
            rm -f "$BACKUP_PATH" "$BACKUP_PATH.sha256"
          }
          trap cleanup EXIT
          PGDATABASE="$RESTORE_DATABASE" PGRESTORE_TARGET_CONFIRM="$RESTORE_DATABASE" \
            bash ./scripts/postgres/restore-verify.sh "$BACKUP_PATH"

      - name: Capture resolved dependency tree
        if: always() && steps.build.outcome == 'success'
        run: ./mvnw -B -ntp dependency:tree -DoutputFile=target/dependency-tree.txt

      - name: Upload test, evaluation, security and R2 evidence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-r2-test-evaluation-security-and-evidence
          path: |
            **/target/surefire-reports/**
            target/dependency-tree.txt
            target/m8-b2-results/**
            target/m8-b3-results/**
            target/m8-r2-results/**
            target/security/**
          if-no-files-found: warn
