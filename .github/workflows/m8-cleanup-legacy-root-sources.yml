name: M8 Remove Legacy Root Source Shadows

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: m8-root-source-cleanup-main
  cancel-in-progress: false

jobs:
  cleanup:
    name: Safely remove audited root-level Java shadows
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the selected main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify active module-owned sources and remove exact legacy shadows
        id: cleanup
        run: python3 scripts/m8/remove-legacy-root-shadows.py

      - name: Verify complete Maven architecture and inventory
        run: python3 scripts/verify-m8-b5-architecture.py

      - name: Verify durable application composition
        run: python3 scripts/verify-m8-app-composition.py

      - name: Test cleanup atomicity and exact-file safeguards
        run: python3 -m unittest scripts.m8.test_legacy_root_shadow_cleanup -v

      - name: Commit only the two audited root-file deletions
        if: steps.cleanup.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add -- \
            src/main/java/dev/supplychain/agent/runtime/cognitive/lifecycle/CognitiveCycleLifecycleServices.java \
            src/test/java/dev/supplychain/agent/runtime/cognitive/lifecycle/CognitiveCycleLifecycleServicesTest.java
          git diff --cached --check
          git commit -m "Remove obsolete root-level lifecycle Java shadows"
          git push origin HEAD:main
          echo "cleanup_commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch the full Java and PostgreSQL CI on the cleaned main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            --data '{"ref":"main"}'
          echo "Dispatched full CI for main after the guarded source cleanup." >> "$GITHUB_STEP_SUMMARY"

    # A manually dispatched run on any branch other than main must not write.
