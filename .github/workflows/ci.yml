name: Java CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java 21 / Maven / LangGraph4j + LangChain4j
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: supply_chain_agent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d supply_chain_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: supply_chain_agent
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Build and run all tests, including PostgreSQL checkpoint recovery
        run: ./mvnw -B -ntp -Dphase0.postgres=true clean verify

      - name: Capture resolved dependency tree
        if: always()
        run: ./mvnw -B -ntp dependency:tree -DoutputFile=target/dependency-tree.txt

      - name: Upload test reports and dependency tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-test-and-dependency-reports
          path: |
            **/target/surefire-reports/**
            target/dependency-tree.txt
          if-no-files-found: warn
